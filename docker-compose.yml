x-app-env: &app-env
  DATABASE_URL: postgresql://amarshop_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: ${AUTH_URL}
  PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN}
  PLATFORM_PUBLIC_IP: ${PLATFORM_PUBLIC_IP:-}
  CUSTOM_DOMAIN_VERIFY_MODE: ${CUSTOM_DOMAIN_VERIFY_MODE:-dns}
  ALLOW_DEMO_STORES: ${ALLOW_DEMO_STORES:-}
  UPLOADS_DIR: /app/uploads
  APP_SECRET_KEY: ${APP_SECRET_KEY}

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Never published to the host — only `app` reaches this, over the
    # internal Docker network (PROJECT_PLAN.md §6).
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile --adapter caddyfile
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  uploads:
