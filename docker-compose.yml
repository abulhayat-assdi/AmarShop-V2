x-app-env: &app-env
  DATABASE_URL: postgresql://amarshop_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: ${AUTH_URL}
  PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN}
  PLATFORM_PUBLIC_IP: ${PLATFORM_PUBLIC_IP:-}
  MARKETING_GA4_ID: ${MARKETING_GA4_ID:-}
  MARKETING_META_PIXEL_ID: ${MARKETING_META_PIXEL_ID:-}
  CUSTOM_DOMAIN_VERIFY_MODE: ${CUSTOM_DOMAIN_VERIFY_MODE:-dns}
  ALLOW_DEMO_STORES: ${ALLOW_DEMO_STORES:-}
  UPLOADS_DIR: /app/uploads
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  BILLING_TICK_SECRET: ${BILLING_TICK_SECRET:-}

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Never published to the host — only `app` reaches this, over the
    # internal Docker network (PROJECT_PLAN.md §6).
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  # Billing v2 lifecycle: POST /api/internal/billing/tick hourly so lapsed
  # trials/periods transition and a store past its 3-day grace is suspended
  # (src/lib/billing/lifecycle.ts). A plain curl loop — no cron daemon
  # needed. Set BILLING_TICK_SECRET in .env or the sweep endpoint 503s.
  billing-cron:
    image: alpine:3
    restart: unless-stopped
    depends_on:
      - app
    environment:
      BILLING_TICK_SECRET: ${BILLING_TICK_SECRET:-}
    command:
      - /bin/sh
      - -c
      - "apk add --no-cache curl >/dev/null; while true; do curl -fsS -m 30 -X POST -H \"Authorization: Bearer $$BILLING_TICK_SECRET\" http://app:3000/api/internal/billing/tick && echo || echo 'billing tick failed'; sleep 3600; done"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile --adapter caddyfile
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  uploads:
